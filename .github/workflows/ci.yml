name: CI

on:
  push:
    branches: [ main, stable ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    name: ${{ matrix.os }} / C++${{ matrix.std }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        std: [ 17, 20 ]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DEVENT_HUB_CPP_BUILD_TESTS=ON -DEVENT_HUB_CPP_BUILD_EXAMPLES=ON -DCMAKE_CXX_STANDARD=${{ matrix.std }}
      - name: Build
        run: cmake --build build --config Release
      - name: Install
        run: cmake --install build --prefix install --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --timeout 30
      - name: Configure install consumer
        run: cmake -S tests/install_consumer -B build-consumer -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install" -DCMAKE_CXX_STANDARD=${{ matrix.std }}
      - name: Build install consumer
        run: cmake --build build-consumer --config Release
      - name: Test install consumer
        run: ctest --test-dir build-consumer -C Release --output-on-failure --timeout 30
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}-cxx${{ matrix.std }}
          path: |
            build/CMakeFiles/CMakeOutput.log
            build/Testing/Temporary/LastTest.log
            build-consumer/CMakeFiles/CMakeOutput.log
            build-consumer/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  linux-extras:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [ asan-ubsan, time-shield-calendar, time-shield-calendar-ntp, time-shield-install-consumer, vcpkg-install ]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure (asan-ubsan)
        if: matrix.suite == 'asan-ubsan'
        run: cmake -S . -B build -DEVENT_HUB_CPP_BUILD_TESTS=ON -DEVENT_HUB_CPP_BUILD_EXAMPLES=ON -DCMAKE_CXX_STANDARD=17 -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
      - name: Build (asan-ubsan)
        if: matrix.suite == 'asan-ubsan'
        run: cmake --build build
      - name: Test (asan-ubsan)
        if: matrix.suite == 'asan-ubsan'
        run: ctest --test-dir build --output-on-failure --timeout 30

      - name: Configure (time-shield-calendar)
        if: matrix.suite == 'time-shield-calendar'
        run: cmake -S . -B build-calendar -DEVENT_HUB_CPP_BUILD_TESTS=ON -DEVENT_HUB_CPP_BUILD_EXAMPLES=ON -DEVENT_HUB_CPP_USE_TIME_SHIELD=ON -DCMAKE_CXX_STANDARD=17
      - name: Build (time-shield-calendar)
        if: matrix.suite == 'time-shield-calendar'
        run: cmake --build build-calendar
      - name: Test (time-shield-calendar)
        if: matrix.suite == 'time-shield-calendar'
        run: ctest --test-dir build-calendar --output-on-failure --timeout 30

      - name: Configure (time-shield-calendar-ntp)
        if: matrix.suite == 'time-shield-calendar-ntp'
        run: cmake -S . -B build-calendar-ntp -DEVENT_HUB_CPP_BUILD_TESTS=ON -DEVENT_HUB_CPP_BUILD_EXAMPLES=ON -DEVENT_HUB_CPP_USE_TIME_SHIELD=ON -DEVENT_HUB_CPP_USE_TIME_SHIELD_NTP=ON -DCMAKE_CXX_STANDARD=17
      - name: Build (time-shield-calendar-ntp)
        if: matrix.suite == 'time-shield-calendar-ntp'
        run: cmake --build build-calendar-ntp
      - name: Test (time-shield-calendar-ntp)
        if: matrix.suite == 'time-shield-calendar-ntp'
        run: ctest --test-dir build-calendar-ntp --output-on-failure --timeout 30

      - name: Configure package with time-shield
        if: matrix.suite == 'time-shield-install-consumer'
        run: cmake -S . -B build-ts-install -DEVENT_HUB_CPP_BUILD_TESTS=ON -DEVENT_HUB_CPP_BUILD_EXAMPLES=ON -DEVENT_HUB_CPP_USE_TIME_SHIELD=ON -DCMAKE_CXX_STANDARD=17 -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install-ts
      - name: Build package with time-shield
        if: matrix.suite == 'time-shield-install-consumer'
        run: cmake --build build-ts-install
      - name: Install package with time-shield
        if: matrix.suite == 'time-shield-install-consumer'
        run: cmake --install build-ts-install --prefix install-ts
      - name: Configure install consumer with time-shield
        if: matrix.suite == 'time-shield-install-consumer'
        run: cmake -S tests/install_consumer -B build-ts-consumer -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install-ts" -DEVENT_HUB_CPP_INSTALL_CONSUMER_USE_CALENDAR=ON -DCMAKE_CXX_STANDARD=17
      - name: Build install consumer with time-shield
        if: matrix.suite == 'time-shield-install-consumer'
        run: cmake --build build-ts-consumer
      - name: Test install consumer with time-shield
        if: matrix.suite == 'time-shield-install-consumer'
        run: ctest --test-dir build-ts-consumer --output-on-failure --timeout 30

      - name: Install vcpkg
        if: matrix.suite == 'vcpkg-install'
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Validate vcpkg overlay port
        if: matrix.suite == 'vcpkg-install'
        run: ./vcpkg/vcpkg install event-hub-cpp --overlay-ports=vcpkg-overlay/ports
      - name: Configure vcpkg consumer
        if: matrix.suite == 'vcpkg-install'
        run: cmake -S tests/install_consumer -B build-vcpkg-consumer -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      - name: Build vcpkg consumer
        if: matrix.suite == 'vcpkg-install'
        run: cmake --build build-vcpkg-consumer
      - name: Test vcpkg consumer
        if: matrix.suite == 'vcpkg-install'
        run: ctest --test-dir build-vcpkg-consumer --output-on-failure --timeout 30

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.suite }}
          path: |
            build/CMakeFiles/CMakeOutput.log
            build/Testing/Temporary/LastTest.log
            build-calendar/CMakeFiles/CMakeOutput.log
            build-calendar/Testing/Temporary/LastTest.log
            build-calendar-ntp/CMakeFiles/CMakeOutput.log
            build-calendar-ntp/Testing/Temporary/LastTest.log
            build-ts-install/CMakeFiles/CMakeOutput.log
            build-ts-install/Testing/Temporary/LastTest.log
            build-ts-consumer/CMakeFiles/CMakeOutput.log
            build-ts-consumer/Testing/Temporary/LastTest.log
            build-vcpkg-consumer/CMakeFiles/CMakeOutput.log
            build-vcpkg-consumer/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
